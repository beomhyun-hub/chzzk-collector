name: 치지직 라이브 수집

on:
  # 15분마다 실행. GitHub 서버가 붐비면 몇 분 늦게 시작될 수 있는데,
  # 수집 시각(collected_at)을 실제 실행 시각으로 기록하므로 분석에는 문제가 없습니다.
  schedule:
    - cron: "*/15 * * * *"

  # Actions 탭에서 "Run workflow" 버튼으로 직접 돌려볼 때 사용합니다.
  workflow_dispatch:

# 앞 회차가 아직 안 끝났으면 겹쳐 돌지 않도록 막습니다.
concurrency:
  group: chzzk-collect
  cancel-in-progress: false

# 이 워크플로우는 저장소를 읽기만 합니다.
permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 정상은 1분 이내. 멈추면 강제 종료하고 다음 회차를 기다립니다.

    steps:
      - name: 소스 받기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          # 비밀값 - 저장소 Settings > Secrets and variables > Actions 에 등록
          CHZZK_CLIENT_ID: ${{ secrets.CHZZK_CLIENT_ID }}
          CHZZK_CLIENT_SECRET: ${{ secrets.CHZZK_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

          # 비밀이 아닌 설정값 - 바꾸고 싶으면 이 파일에서 숫자만 고치면 됩니다
          MIN_CONCURRENT_USERS: "10"
          MAX_PAGES: "200"
          PAGE_DELAY_SECONDS: "0.3"
          REQUEST_TIMEOUT: "10"
          MAX_RETRIES: "3"
          RETENTION_DAYS: "30"
        run: |
          set -o pipefail
          python -m chzzk_collector.collect 2>&1 | tee collect.log

      - name: 실행 결과 요약 남기기
        if: always()
        run: |
          {
            echo "### 수집 결과"
            echo ""
            echo '```'
            tail -n 12 collect.log 2>/dev/null || echo "로그 없음"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
