name: 치지직 라이브 수집

on:
  # GitHub 무료 예약 실행은 지정한 cron 간격을 지켜주지 않습니다.
  # 실측(2026-08-30~31): 15분으로 걸어도 실제 발동은 2시간 15분~6시간 3분마다 한 번이었습니다.
  # 그래서 cron 은 '작업을 깨우는 방아쇠'로만 쓰고,
  # 실제 15분 간격은 _collect-loop.yml 안의 반복문이 지킵니다.
  schedule:
    - cron: "7,22,37,52 * * * *"

  # Actions 탭에서 "Run workflow" 버튼으로 직접 돌려볼 때 사용합니다.
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "반복할 시간(분). 0 이면 1회만 수집하고 끝냅니다."
        default: "0"
        required: false

# 뒤늦게 깨어난 회차가 앞 회차를 이어받습니다.
# 구간이 길게 이어지는 구조라 겹쳐 돌면 안 되고, 새 회차가 더 최신이므로 앞 것을 취소시킵니다.
concurrency:
  group: chzzk-collect
  cancel-in-progress: true

permissions:
  # 불러오는 수집 워크플로가 gh-pages 에 사이트를 밀어야 합니다.
  contents: write

# 작업 하나의 수명 한계가 6시간이라, 340분짜리 구간을 이어붙여 한 번 깨어날 때
# 17시간까지 덮습니다. 관측된 최대 cron 간격(6시간 3분)보다 넉넉합니다.
# 예약 실행이 아닌 수동 실행은 1구간만 돌고 끝납니다.
jobs:
  leg1:
    uses: ./.github/workflows/_collect-loop.yml
    with:
      duration_minutes: ${{ github.event_name == 'schedule' && 340 || fromJSON(github.event.inputs.duration_minutes || '0') }}
      # 오래 잠들어 있다 깨어난 직후라 경계를 기다리지 않고 바로 한 번 수집합니다.
      collect_immediately: true
      leg: "1/3"
    secrets: inherit

  leg2:
    needs: leg1
    # 앞 구간이 실패해도 이어받습니다. 취소된 경우(새 회차가 이어받은 경우)에만 멈춥니다.
    if: ${{ github.event_name == 'schedule' && !cancelled() }}
    uses: ./.github/workflows/_collect-loop.yml
    with:
      duration_minutes: 340
      leg: "2/3"
    secrets: inherit

  leg3:
    needs: leg2
    if: ${{ github.event_name == 'schedule' && !cancelled() }}
    uses: ./.github/workflows/_collect-loop.yml
    with:
      duration_minutes: 340
      leg: "3/3"
    secrets: inherit
